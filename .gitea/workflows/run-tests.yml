name: Run project tests

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          bun tests/test-acl-limit.js
          bun tests/test-botdms-routing.js
          bash tests/test-bot.sh
